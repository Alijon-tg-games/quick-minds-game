<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mantiq Jangi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#10122a;--panel:#1b1f42;--text:#f3f5ff;--muted:#98a1d4;--accent:#7c5cff;--accent2:#22d3ee;--good:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
.screen{display:none;flex:1;flex-direction:column;min-height:0}.screen.active{display:flex}
h1{margin:6px 0 4px;text-align:center;font-size:30px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--muted);margin:0 0 14px;font-size:14px}
.banner{margin:0 0 12px;padding:8px 10px;border-radius:12px;background:var(--panel);font-size:13px;color:var(--muted);text-align:center}
.banner b{color:var(--text)}.banner.live{background:linear-gradient(90deg,#1f3a4d,#2a2570);color:#d8e4ff}.banner.warn{color:#f59e0b}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
.pill{background:var(--panel);border-radius:12px;padding:6px 12px;font-weight:700}
.bar{height:8px;background:var(--panel);border-radius:8px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .1s linear}
.bar.low i{background:var(--bad)}
.q{flex:0 0 auto;background:var(--panel);border-radius:18px;padding:18px 16px;font-size:19px;font-weight:700;line-height:1.4;min-height:130px;display:flex;align-items:center;justify-content:center;text-align:center}
.opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.opt{background:var(--panel);border:0;border-radius:14px;padding:15px 12px;font:inherit;font-size:17px;font-weight:600;color:var(--text);cursor:pointer;transition:background .15s,transform .08s}
.opt:active{transform:scale(.98)}
.opt.ok{background:var(--good)}.opt.no{background:var(--bad)}
.opt:disabled{cursor:default}
.tag{align-self:center;margin-top:10px;font-size:13px;color:var(--muted)}
button.btn{font:inherit;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:16px;color:var(--text);background:var(--panel);cursor:pointer;width:100%}
button.main{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
button.btn:active{transform:scale(.98)}
.res{align-items:center;justify-content:center;text-align:center;gap:10px}
.big{font-size:64px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.stat{background:var(--panel);border-radius:14px;padding:12px 4px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}
.note{color:var(--muted);font-size:14px;min-height:20px}
.rules{background:var(--panel);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);line-height:1.6;margin:8px 0 14px}
.rules b{color:var(--text)}
#lb{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;padding:14px;max-width:520px;margin:0 auto;z-index:5;overflow:auto}
#lb.show{display:flex}#lb h2{margin:6px 0 10px;text-align:center}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row.me{outline:2px solid var(--accent)}.rank{width:34px;font-weight:800;font-size:18px;text-align:center}
.who{flex:1;min-width:0}.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who a{color:var(--accent2);font-size:13px;text-decoration:none}.pts{font-weight:800;font-size:17px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<div id="app">

  <section id="menu" class="screen active">
    <h1>🧠 Mantiq Jangi</h1>
    <p class="sub">30 ta savol, har biriga 25 soniya</p>
    <div class="rules">
      <b>Qoida:</b> 10 ta oson, 10 ta o'rta, 10 ta qiyin savol.<br>
      To'g'ri javob: <b>100 ball</b> + tezlik bonusi (100 gacha).<br>
      Vaqt tugasa yoki noto'g'ri bo'lsa: <b>0 ball</b>.
    </div>
    <div class="banner" id="banner">Mashq rejimi</div>
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
      <button class="btn main" id="startBtn">Boshlash</button>
      <button class="btn" id="menuLb">🏆 Reyting</button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="hud">
      <div class="pill"><span id="qno">1</span>/30 · <span id="diff">Oson</span></div>
      <div class="pill">⭐ <span id="score">0</span></div>
    </div>
    <div class="bar" id="barBox"><i id="bar"></i></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="tag" id="tag"></div>
  </section>

  <section id="result" class="screen res">
    <h1>Tugadi!</h1>
    <div class="big" id="rScore">0</div>
    <div class="stats">
      <div class="stat"><b id="rOk">0</b><span>to'g'ri javob</span></div>
      <div class="stat"><b id="rTime">0</b><span>sarflangan soniya</span></div>
    </div>
    <div class="note" id="rNote"></div>
    <div style="width:100%;margin-top:auto;display:flex;flex-direction:column;gap:10px">
      <button class="btn main" id="again">Qayta o'ynash</button>
      <button class="btn" id="resLb">🏆 Reyting</button>
    </div>
  </section>

</div>

<div id="lb">
  <h2>🏆 Reyting</h2>
  <div class="banner" id="lbBanner"></div>
  <div id="lbList"></div>
  <button class="btn main" id="lbClose" style="margin-top:auto">Yopish</button>
</div>

<script>
// Mantiq Jangi: 30 savol (10 oson, 10 o'rta, 10 qiyin). Brauzer ham, server ham shu faylni ishlatadi.
(function (root) {
  function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
  const TIME_MS = 25000;
  const PICK = { 1: { hand: 8, gen: 2 }, 2: { hand: 8, gen: 2 }, 3: { hand: 10, gen: 0 } };
  const rint = (r, a, b) => a + Math.floor(r() * (b - a + 1));
  function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // [savol, to'g'ri javob, [3 ta noto'g'ri javob]]
  const HAND = {

      ["Bir kishining 3 ta qizi bor. Har birining bittadan akasi bor. Oilada nechta bola?", "4", ["3", "6", "7"]],
      ["7 + 8 nechaga teng?", "15", ["13", "14", "16"]],
      ["9 × 3 nechaga teng?", "27", ["24", "21", "30"]],
      ["100 − 37 nechaga teng?", "63", ["67", "73", "57"]],

      ["O'zbekistonning poytaxti qaysi shahar?", "Toshkent", ["Samarqand", "Buxoro", "Andijon"]],

      ["Daftar va ruchka birga 1100 so'm. Daftar ruchkadan roppa-rosa 1000 so'm qimmat. Ruchka necha so'm?", "50 so'm", ["100 so'm", "150 so'm", "1000 so'm"]],
      ["3 kishi 3 ta ishni 3 soatda bitiradi. 9 kishi 9 ta ishni necha soatda bitiradi?", "3 soat", ["1 soat", "9 soat", "27 soat"]],
      ["Qatorni davom ettiring: 2, 3, 5, 7, 11, ?", "13", ["12", "14", "15"]],
      ["A harfi B dan oldin. C harfi A dan keyin, lekin B dan oldin. To'g'ri tartib qaysi?", "A, C, B", ["C, A, B", "A, B, C", "B, A, C"]],
      ["Lift 1-qavatdan 5-qavatga 12 soniyada chiqadi. 3-qavatga necha soniyada chiqadi?", "6 soniya", ["7,2 soniya", "8 soniya", "9 soniya"]],
      ["1 dan 100 gacha bo'lgan hamma sonlar yig'indisi qancha?", "5050", ["5000", "5100", "4950"]],
      ["3 ga bo'lsa 2 qoldiq, 5 ga bo'lsa 3 qoldiq qoladigan eng kichik natural son qaysi?", "8", ["3", "13", "23"]],
      ["10 kishi xonada har biri boshqa hamma bilan bir martadan qo'l berib ko'rishdi. Jami nechta qo'l berish bo'ldi?", "45", ["20", "55", "90"]],
      ["Bir kishi 100 metrni 20 soniyada yuguradi. Shu tezlikda 1 km ni qancha vaqtda yuguradi?", "3 daqiqa 20 soniya", ["2 daqiqa 30 soniya", "3 daqiqa", "5 daqiqa"]],

      ["240 ning 15% i necha?", "36", ["30", "40", "42"]],
      ["240 km yo'lni 80 km/soat tezlikda necha soatda bosib o'tasiz?", "3 soat", ["2 soat", "4 soat", "2,5 soat"]],

      ["√1764 nechaga teng?", "42", ["38", "40", "44"]],
      ["160 betlik kitobning 3/8 qismini o'qidingiz. Necha bet?", "60", ["45", "55", "65"]],
      ["Uchburchakning ikki burchagi 50° va 70°. Uchinchi burchak necha gradus?", "60°", ["50°", "70°", "80°"]],
      ["Qaysi biri katta: 2^10 yoki 10^3?", "2^10", ["10^3", "Teng", "Aniqlab bo'lmaydi"]],
      ["Qatorni davom ettiring: 2, 6, 12, 20, 30, ?", "42", ["36", "40", "44"]],
      ["Dushanbadan 9 kun keyin qaysi kun bo'ladi?", "Chorshanba", ["Seshanba", "Payshanba", "Juma"]],
    ],
    3: [

      ["8 ta bir xil ko'rinishdagi sharning bittasi biroz og'ir. Pallali tarozida kamida necha marta tortib, og'ir sharni aniq topasiz?", "2 marta", ["1 marta", "3 marta", "4 marta"]],
      ["Bir sutkada soat va daqiqa millari necha marta ustma-ust tushadi?", "22 marta", ["11 marta", "23 marta", "24 marta"]],
      ["Ali: \"Vali yolg'onchi\". Vali: \"Hasan yolg'onchi\". Hasan: \"Ali ham, Vali ham yolg'onchi\". Kim rost gapirmoqda?", "Faqat Vali", ["Faqat Ali", "Faqat Hasan", "Hammasi rost"]],
      ["5 ta ketma-ket butun sonning yig'indisi 100. Ularning eng kichigi nechaga teng?", "18", ["16", "19", "20"]],

      ["1 dan 100 gacha bo'lgan sonlardan 3 yoki 5 ga bo'linadiganlarining yig'indisi nechaga teng?", "2418", ["2318", "2508", "2250"]],
      ["100! sonining oxirida nechta nol bor?", "24", ["20", "25", "30"]],
      ["360 sonining nechta natural bo'luvchisi bor?", "24", ["18", "30", "36"]],
      ["Soat 2:30 da soat va daqiqa millari orasidagi burchak necha gradus?", "105°", ["90°", "120°", "135°"]],
      ["Ikki zar tashlanganda yig'indisi 7 bo'lish ehtimoli qancha?", "1/6", ["1/5", "5/36", "1/4"]],
      ["7^2024 sonining oxirgi raqami nechaga teng?", "1", ["3", "7", "9"]],
      ["100 ta chiroq o'chiq. 1-odam hamma chiroqni, 2-odam har ikkinchisini, ... 100-odam faqat 100-chiroqni almashtiradi (yoqadi yoki o'chiradi). Oxirida nechta chiroq yonadi?", "10", ["5", "20", "50"]],
      ["2^100 sonini 7 ga bo'lganda qoldiq nechaga teng?", "2", ["1", "4", "6"]],
      ["12 burchakli qavariq ko'pburchakning ichki burchaklari yig'indisi necha gradus?", "1800°", ["1620°", "1900°", "2160°"]],
      ["1 dan 1000 gacha bo'lgan sonlarda raqami 7 necha marta uchraydi?", "300", ["271", "280", "333"]],
      ["3 xonali sonlardan nechtasi 6 ga bo'linadi?", "150", ["149", "151", "166"]],
      ["x² − 5x + 6 = 0 tenglama ildizlarining yig'indisi bilan ko'paytmasining yig'indisi nechaga teng?", "11", ["30", "36", "25"]],
    ],
  };

  // ---------- Sonli qator generatorlari (oson va o'rta) ----------
  function mk(shown, ans, step, r) {
    const text = "Qatorni davom ettiring: " + shown.join(", ") + ", ?";
    const cand = [ans + 1, ans - 1, ans + 2, ans - 2, ans + step, ans - step, ans + 10, ans - 10, ans * 2];
    const set = [];
    for (const c of shuffle(cand, r)) if (c !== ans && c > 0 && !set.includes(c)) set.push(c);
    return [text, String(ans), set.slice(0, 3).map(String)];
  }
  const GEN = {
    1: [
      r => { const d = rint(r, 2, 9), s = rint(r, 1, 15); const a = []; for (let i = 0; i < 5; i++) a.push(s + d * i); return mk(a, s + d * 5, d, r); },
      r => { const n = rint(r, 1, 4); const a = []; for (let i = 0; i < 4; i++) a.push((n + i) * (n + i)); return mk(a, (n + 4) * (n + 4), 2 * (n + 4), r); },
    ],
    2: [
      r => { const s = rint(r, 1, 4), k = rint(r, 2, 3); const a = []; for (let i = 0; i < 4; i++) a.push(s * Math.pow(k, i)); return mk(a, s * Math.pow(k, 4), s * Math.pow(k, 3), r); },
      r => { const s = rint(r, 1, 9); const a = [s]; for (let i = 1; i < 5; i++) a.push(a[i - 1] + i); return mk(a, a[4] + 5, 5, r); },
      r => { const s = rint(r, 5, 20), p = rint(r, 4, 9), q = rint(r, 1, p - 2); const a = [s]; for (let i = 1; i < 6; i++) a.push(a[i - 1] + (i % 2 ? p : -q)); return mk(a.slice(0, 5), a[5], p, r); },
      r => { const n = rint(r, 1, 5); const a = []; for (let i = 0; i < 4; i++) a.push((n + i) * (n + i) + 1); return mk(a, (n + 4) * (n + 4) + 1, 2 * (n + 4), r); },
    ],
  };

  function build(seed) {
    const r = mulberry32(seed >>> 0);
    const out = [];
    for (const d of [1, 2, 3]) {
      const items = shuffle(HAND[d], r).slice(0, PICK[d].hand);
      const gens = GEN[d] || [];
      const order = shuffle(gens.map((_, i) => i), r);
      for (let i = 0; i < PICK[d].gen; i++) items.push(gens[order[i % order.length]](r));
      for (const q of shuffle(items, r)) {
        const opts = shuffle([q[1]].concat(q[2]), r);
        out.push({ d, q: q[0], o: opts, a: opts.indexOf(q[1]) });
      }
    }
    return out;
  }
  function publicQuiz(seed) { return build(seed).map(({ d, q, o }) => ({ d, q, o })); }
  function points(correct, ms) {
    if (!correct) return 0;
    const t = Math.min(Math.max(ms | 0, 0), TIME_MS);
    return 100 + Math.round(100 * (1 - t / TIME_MS));
  }
  function scoreOf(seed, answers) {
    const quiz = build(seed);
    if (!Array.isArray(answers) || answers.length !== quiz.length) return { valid: false, error: 'format' };
    let score = 0, correct = 0, totalMs = 0;
    for (let i = 0; i < quiz.length; i++) {
      const a = answers[i];
      if (!a || !Number.isInteger(a.a) || a.a < -1 || a.a > 3 || !Number.isFinite(a.t) || a.t < 0 || a.t > TIME_MS + 1000) return { valid: false, error: 'format' };
      const ok = a.a === quiz[i].a;
      if (ok) correct++;
      score += points(ok, a.t); totalMs += Math.min(a.t, TIME_MS);
    }
    return { valid: true, score, correct, totalMs };
  }

  const api = { build, publicQuiz, scoreOf, points, TIME_MS, HAND, GEN };
  if (typeof module !== 'undefined') module.exports = api; else root.LogicEngine = api;
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
const API_URL = "https://quick-minds.alijonaye804.workers.dev";
const E = LogicEngine;
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.initData);
let tgUser = null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#10122a'); tg.setBackgroundColor('#10122a'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){}
  tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user || null; }
const $ = id => document.getElementById(id);
const haptic = t => { try { tg && tg.HapticFeedback.notificationOccurred(t); } catch(e){} };
const DIFF = ['', 'Oson', "O'rta", 'Qiyin'];

let quiz = [], seed = 0, idx = 0, answers = [], qStart = 0, timer = null, locked = true, contest = null, submitted = false;

function screen(id){ ['menu','game','result'].forEach(s=>$(s).classList.toggle('active', s===id)); }

function startGame(){
  seed = (Math.random()*4294967296)>>>0;   // mashq rejimi; musobaqada seed serverdan keladi
  quiz = E.build(seed); idx = 0; answers = []; submitted = false;
  screen('game'); showQ();
}

function showQ(){
  const q = quiz[idx];
  $('qno').textContent = idx+1; $('diff').textContent = DIFF[q.d];
  $('score').textContent = answers.reduce((s,a)=>s+a.p,0);
  $('q').textContent = q.q; $('tag').textContent = '';
  const box = $('opts'); box.innerHTML = '';
  q.o.forEach((text,i)=>{
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = text;
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
  locked = false; qStart = performance.now();
  clearInterval(timer); timer = setInterval(tick, 50); tick();
}

function tick(){
  const el = performance.now() - qStart;
  const left = Math.max(0, E.TIME_MS - el);
  $('bar').style.width = (left/E.TIME_MS*100)+'%';
  $('barBox').classList.toggle('low', left < 6000);
  if (left <= 0 && !locked) answer(-1);
}

function answer(i){
  if (locked) return;
  locked = true; clearInterval(timer);
  const t = Math.min(E.TIME_MS, Math.round(performance.now() - qStart));
  const q = quiz[idx];
  const ok = i === q.a;
  const p = E.points(ok, t);
  answers.push({ a: i, t, p });
  [...$('opts').children].forEach((b,k)=>{
    b.disabled = true;
    if (k === q.a) b.classList.add('ok');
    else if (k === i) b.classList.add('no');
  });
  $('tag').textContent = ok ? ('+' + p + ' ball') : (i === -1 ? "Vaqt tugadi" : "Noto'g'ri");
  $('score').textContent = answers.reduce((s,a)=>s+a.p,0);
  haptic(ok ? 'success' : 'error');
  setTimeout(()=>{ idx++; idx < quiz.length ? showQ() : finish(); }, 900);
}

async function finish(){
  const score = answers.reduce((s,a)=>s+a.p,0);
  const ok = answers.filter((a,k)=>a.a===quiz[k].a).length;
  const sec = (answers.reduce((s,a)=>s+a.t,0)/1000).toFixed(1);
  $('rScore').textContent = score; $('rOk').textContent = ok+'/30'; $('rTime').textContent = sec;
  $('rNote').textContent = '';
  screen('result');
  await submit(score);
}

async function submit(score){
  if (submitted) return; submitted = true;
  if (!API_URL || !inTelegram){ return; }
  if (contest && contest.status==='upcoming'){ $('rNote').textContent = 'Musobaqa hali boshlanmadi, natija hisobga olinmadi.'; return; }
  if (contest && contest.status==='ended'){ $('rNote').textContent = 'Musobaqa tugagan.'; return; }
  if (!(tgUser && tgUser.username)){ $('rNote').textContent = "⚠️ Reytingda qatnashish uchun Telegram sozlamalarida username qo'ying."; return; }
  try {
    const res = await api('/score', { method:'POST', body: JSON.stringify({ initData: tg.initData, seed, answers: answers.map(a=>({a:a.a,t:a.t})) }) });
    $('rNote').textContent = res.ok ? (res.improved ? '🏆 Reytingda: '+res.rank+'-o\'rin' : 'Eng yaxshi natijangiz '+res.best+' (' + res.rank + '-o\'rin)') : (res.error || 'Natija yuborilmadi');
  } catch(e){ $('rNote').textContent = 'Internet xatosi, natija yuborilmadi'; }
}

async function api(path, opt){ const r = await fetch(API_URL+path, Object.assign({headers:{'Content-Type':'application/json'}}, opt||{})); return r.json(); }
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtLeft(ms){ const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;
  return d>0?d+' kun '+h+' soat':h>0?h+' soat '+m+' daqiqa':m+':'+String(x).padStart(2,'0'); }
function renderBanner(){
  let html='Mashq rejimi', c='';
  if (!API_URL) html='Mashq rejimi (reyting tez orada)';
  else if (!inTelegram){ html="Reyting uchun o'yinni Telegram orqali oching"; c='warn'; }
  else if (contest){
    const now=Date.now();
    if (contest.status==='upcoming') html='⏳ Musobaqa boshlanishiga: <b>'+fmtLeft(contest.start-now)+'</b>';
    else if (contest.status==='live'){ html='🔥 Musobaqa tugashiga: <b>'+fmtLeft(contest.end-now)+'</b>'; c='live'; }
    else html='🏁 Musobaqa tugadi';
  }
  ['banner','lbBanner'].forEach(id=>{ $(id).className='banner '+c; $(id).innerHTML=html; });
}
async function loadContest(){
  if (!API_URL || !inTelegram){ renderBanner(); return; }
  try { const r = await api('/leaderboard?initData='+encodeURIComponent(tg.initData)); if (r.ok) contest = r.contest; } catch(e){}
  renderBanner();
}
async function openLb(){
  $('lb').classList.add('show'); const list=$('lbList'); addAdminBtn();
  if (!API_URL || !inTelegram){ list.innerHTML='<div class="empty">Reyting Telegram ichida, musobaqa boshlanganda ishlaydi.</div>'; renderBanner(); return; }
  list.innerHTML='<div class="empty">Yuklanmoqda…</div>';
  try {
    const r = await api('/leaderboard?initData='+encodeURIComponent(tg.initData)); if (!r.ok) throw 0;
    contest = r.contest; renderBanner();
    if (!r.top.length){ list.innerHTML='<div class="empty">Hali hech kim o\'ynamagan. Birinchi bo\'ling! 🚀</div>'; return; }
    const medals=['🥇','🥈','🥉'];
    list.innerHTML = r.top.map((p,i)=>{
      const me = r.me && r.me.id===p.id;
      const link = p.username ? '<a href="https://t.me/'+p.username+'" target="_blank">@'+p.username+'</a>' : '';
      return '<div class="row'+(me?' me':'')+'"><div class="rank">'+(medals[i]||(i+1))+'</div><div class="who"><b>'+esc(p.name)+(me?' (siz)':'')+'</b>'+link+'</div><div class="pts">'+p.score+'</div></div>';
    }).join('');
    if (r.me && r.me.rank > r.top.length) list.innerHTML += '<div class="row me"><div class="rank">'+r.me.rank+'</div><div class="who"><b>Siz</b></div><div class="pts">'+r.me.best+'</div></div>';
  } catch(e){ list.innerHTML='<div class="empty">Reytingni yuklab bo\'lmadi.</div>'; }
}


const ADMIN_TG_ID = "6286090670";
function addAdminBtn(){
  if (!tgUser || String(tgUser.id)!==ADMIN_TG_ID || $('admBtn')) return;
  const b=document.createElement('button'); b.id='admBtn'; b.textContent='📋 Admin: barcha natijalar';
  b.style.cssText='margin:10px 0;padding:10px;width:100%;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-size:15px;cursor:pointer';
  b.onclick=showAllScores;
  $('lbList').insertAdjacentElement('afterend', b);
}
async function showAllScores(){
  const list=$('lbList'); list.innerHTML='<div class="empty">Yuklanmoqda…</div>';
  try {
    const r = await api('/admin/scores?initData='+encodeURIComponent(tg.initData));
    if (!r.ok) throw 0;
    if (!r.rows.length){ list.innerHTML='<div class="empty">Hozircha natija yo\'q</div>'; return; }
    list.innerHTML = r.rows.map((p,i)=>'<div class="row"><div class="rank">'+(i+1)+'</div><div class="who"><b>'+esc(p.name)+'</b> '+(p.username?'@'+esc(p.username):'')+'<br><small>ID: '+p.user_id+'</small></div><div class="pts">'+p.best+'</div></div>').join('');
  } catch(e){ list.innerHTML='<div class="empty">Ruxsat yo\'q yoki xato</div>'; }
}
$('startBtn').onclick = startGame;
$('again').onclick = startGame;
$('menuLb').onclick = openLb; $('resLb').onclick = openLb;
$('lbClose').onclick = ()=>$('lb').classList.remove('show');
renderBanner(); loadContest(); setInterval(renderBanner, 1000);
</script>
